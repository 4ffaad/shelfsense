[project]
name = "shelfsense"
version = "0.1.0"
description = "Local-first retail shelf vision and inventory monitoring"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
vision = [
  "numpy>=2,<3",
  "opencv-python>=4.10,<5",
  "pillow>=11,<12",
  "torch>=2.5,<3",
]
data = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "python-docx>=1.1,<2",
  "pillow>=11,<12",
]

[project.scripts]
shelfsense = "shelfsense.__main__:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelfsense"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
